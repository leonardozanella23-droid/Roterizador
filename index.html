<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roterizador - Transportadora SP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>Roterizador - Transportadora SP</h1>
            <div class="header-actions">
                <button id="btn-export-csv" class="btn btn-secondary">Exportar CSV</button>
                <button id="btn-export-json" class="btn btn-secondary">Exportar JSON</button>
                <button id="btn-optimize" class="btn btn-primary">Otimizar Rotas</button>
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="panel">
                    <h2>Ponto de Partida</h2>
                    <form id="form-deposito">
                        <div class="form-group">
                            <label for="deposito-endereco">Endereço do Depósito</label>
                            <input type="text" id="deposito-endereco" value="Rua Estrela do Oeste, 124 - Vila Barros" />
                        </div>
                        <div class="form-group">
                            <label>Coordenadas atuais</label>
                            <div id="deposito-coords" style="font-size: 0.8rem; color: #666;">-23.4399, -46.4993</div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Atualizar Ponto de Partida</button>
                    </form>
                    <div style="margin-top: 8px; text-align: center;">
                        <button id="btn-click-map" class="btn btn-secondary btn-small">Clique no mapa para definir</button>
                    </div>
                </div>

                <div class="panel">
                    <h2>Cadastro de Clientes</h2>
                    <form id="form-cliente">
                        <div class="form-group">
                            <label for="nome">Nome do Cliente</label>
                            <input type="text" id="nome" required placeholder="Ex: Mercado São Jorge" />
                        </div>
                        <div class="form-group">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco" required placeholder="Ex: Rua Augusta, 1000 - Consolação" />
                        </div>
                        <div class="form-group">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" required placeholder="Ex: Consolação" />
                        </div>
                        <div class="form-group">
                            <label for="janela-inicio">Janela de Entrega - Início</label>
                            <input type="time" id="janela-inicio" value="08:00" />
                        </div>
                        <div class="form-group">
                            <label for="janela-fim">Janela de Entrega - Fim</label>
                            <input type="time" id="janela-fim" value="18:00" />
                        </div>
                        <div class="form-group">
                            <label for="veiculo">Veículo</label>
                            <select id="veiculo">
                                <option value="1">Veículo 1</option>
                                <option value="2">Veículo 2</option>
                                <option value="3">Veículo 3</option>
                                <option value="4">Veículo 4</option>
                                <option value="5">Veículo 5</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Adicionar Cliente</button>
                    </form>
                </div>

                <div class="panel">
                    <h2>Lista de Clientes</h2>
                    <div class="filtro-veiculo">
                        <label>Filtrar por veículo:</label>
                        <select id="filtro-veiculo">
                            <option value="todos">Todos</option>
                            <option value="1">Veículo 1</option>
                            <option value="2">Veículo 2</option>
                            <option value="3">Veículo 3</option>
                            <option value="4">Veículo 4</option>
                            <option value="5">Veículo 5</option>
                        </select>
                    </div>
                    <div id="lista-clientes" class="lista-clientes"></div>
                </div>

                <div class="panel">
                    <h2>Resumo das Rotas</h2>
                    <div id="resumo-rotas"></div>
                </div>
            </aside>

            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
